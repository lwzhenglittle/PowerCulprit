    <circle cx="700" cy="690" r="102" fill="#07111F" fill-opacity="0.93" stroke="#F8FAFC" stroke-width="30"/>
    <circle cx="700" cy="690" r="50" fill="#FB923C" fill-opacity="0.16" stroke="#FDBA74" stroke-width="14"/>
    <path d="M672 690H728" stroke="#FDBA74" stroke-width="16" stroke-linecap="round"/>
    <path d="M700 662V718" stroke="#FDBA74" stroke-width="16" stroke-linecap="round"/>
    <path d="M772 762L846 836" stroke="#F8FAFC" stroke-width="46" stroke-linecap="round"/>
    <path d="M772 762L846 836" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" stroke-opacity="0.38"/>
  </g>

  <path d="M248 820H346" stroke="#4ADE80" stroke-width="28" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M392 820H522" stroke="#38BDF8" stroke-width="28" stroke-linecap="round" stroke-opacity="0.43"/>
</svg>
