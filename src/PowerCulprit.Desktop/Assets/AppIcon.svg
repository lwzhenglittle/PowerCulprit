<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PowerCulprit app icon</title>
  <desc id="desc">A clear battery-drain analyzer icon: battery, discharge chart, warning bolt, and magnifying lens.</desc>

  <defs>
    <linearGradient id="background" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122033"/>
      <stop offset="0.52" stop-color="#0B1729"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(505 418) rotate(90) scale(456 486)">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#22C55E" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="batteryBorder" x1="198" y1="270" x2="815" y2="702" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86EFAC"/>
      <stop offset="0.47" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="batteryFill" x1="286" y1="604" x2="753" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.52" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="chartLine" x1="291" y1="398" x2="716" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBF7D0"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>

    <linearGradient id="boltFill" x1="546" y1="336" x2="455" y2="664" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7"/>
      <stop offset="0.48" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>

    <filter id="mainShadow" x="104" y="130" width="808" height="794" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="softGlow" x="246" y="346" width="516" height="342" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22D3EE" flood-opacity="0.45"/>
    </filter>

    <clipPath id="batteryInterior">
      <rect x="264" y="330" width="490" height="344" rx="54"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#background)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#ambientGlow)"/>

  <path d="M202 210C277 150 382 123 514 126C648 129 760 176 832 258" stroke="#38BDF8" stroke-width="34" stroke-linecap="round" stroke-opacity="0.12"/>
  <path d="M184 786C279 852 384 882 512 880C644 878 760 831 842 744" stroke="#4ADE80" stroke-width="42" stroke-linecap="round" stroke-opacity="0.09"/>

