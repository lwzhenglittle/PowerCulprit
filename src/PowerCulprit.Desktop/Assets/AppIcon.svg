    <path d="M322 286H695C748 286 791 329 791 382V420H824C847 420 866 439 866 462V542C866 565 847 584 824 584H791V622C791 675 748 718 695 718H322C269 718 226 675 226 622V382C226 329 269 286 322 286Z" fill="#08111F" stroke="url(#batteryBorder)" stroke-width="36" stroke-linejoin="round"/>

