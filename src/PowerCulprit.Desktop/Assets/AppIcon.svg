      <path d="M264 636V580C318 586 365 574 411 537C456 500 501 484 556 505C617 528 674 523 754 462V674H264V636Z" fill="url(#batteryFill)" opacity="0.92"/>
      <path d="M264 423H754" stroke="#E2E8F0" stroke-width="16" stroke-opacity="0.07"/>
      <path d="M264 510H754" stroke="#E2E8F0" stroke-width="16" stroke-opacity="0.06"/>
      <path d="M264 597H754" stroke="#E2E8F0" stroke-width="16" stroke-opacity="0.06"/>
    </g>

    <g filter="url(#softGlow)">
      <path d="M298 398C345 439 387 469 434 486C487 505 532 499 577 531C620 562 650 608 714 632" stroke="#E0F2FE" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M298 398C345 439 387 469 434 486C487 505 532 499 577 531C620 562 650 608 714 632" stroke="url(#chartLine)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <circle cx="298" cy="398" r="24" fill="#22C55E" stroke="#DCFCE7" stroke-width="9"/>
    <circle cx="435" cy="486" r="21" fill="#38BDF8" stroke="#E0F2FE" stroke-width="8"/>
    <circle cx="576" cy="531" r="22" fill="#FBBF24" stroke="#FEF3C7" stroke-width="8"/>
    <circle cx="714" cy="632" r="29" fill="#F97316" stroke="#FFEDD5" stroke-width="10"/>

